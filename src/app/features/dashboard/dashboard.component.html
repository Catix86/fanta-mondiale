<!-- HEADER CONTENT -->
<header class="dashboard-header">
  @if(user$ | async; as user) {
  <div class="dashboard-user-row">
    <p class="hello">Ciao, {{ user.username }}</p>
    <button type="button" class="logout-button" (click)="logout()" aria-label="Esci">
      Logout
    </button>
  </div>
  <h1>Fanta Mondiale 2026</h1>
  }
</header>

<!-- DASHBOARD CONTENT -->
<main class="dashboard-content">
  @if(user$ | async; as user) {
  @for (stat of stats(); track stat) {
  <section class="card dashboard-row">
    <span class="material-symbols-rounded">{{ stat.icon }}</span>
    <div class="user-info">
      <h2>{{ stat.title }}</h2>
    </div>
    @if(stat.icon === 'trophy') {
    <img class="team-flag" [src]="user.championPick | teamFlag" [alt]="user.championPick" loading="lazy">
    }
    <strong class="points">{{ stat.value || user.championPick }}</strong>
  </section>
  }
  }
</main>
